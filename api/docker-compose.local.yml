# Lokaler Test OHNE Tunnel: Website + API nur auf 127.0.0.1:3000 des eigenen Rechners (http://localhost:3000).
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build api
# cloudflared liegt hier im Profil "tunnel" und startet daher nicht mit.
services:
  api:
    build:
      args:
        SITE_URL: http://localhost:3000
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      TRUST_PROXY: none
      SITE_URL: http://localhost:3000
      LOG_REQUESTS: 'true'

  cloudflared:
    profiles: [tunnel]
