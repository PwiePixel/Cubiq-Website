# Cubiq-Website und API hinter einem Cloudflare-Tunnel (siehe README.md).
# Die API veröffentlicht KEINEN Port – erreichbar ist sie nur über cloudflared
# im internen Netz. Werte kommen aus .env (siehe .env.example).
name: cubiq-api

services:
  api:
    # Kontext ist der ganze Repo-Ordner: Website + API (api/) und Doku (docs-site/).
    build:
      context: ..
      dockerfile: api/Dockerfile
      # Die Doku ist statisch – ihre Links zur Website entstehen beim Bauen aus denselben Adressen.
      args:
        SITE_URL: ${SITE_URL:?SITE_URL fehlt in .env (z. B. https://deine-domain.de)}
        WIKI_URL: ${WIKI_URL:-}
    image: cubiq-api:latest
    restart: unless-stopped
    # Alle Werte aus .env (SITE_URL, Mail, Microsoft-Anmeldung, Impressum NUXT_PUBLIC_OPERATOR_* …) –
    # nur der Tunnel-Token bleibt bei cloudflared.
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in .env}
      SITE_URL: ${SITE_URL:?SITE_URL fehlt in .env (z. B. https://deine-domain.de)}
      TUNNEL_TOKEN: ''
    volumes:
      - cubiq-data:/data
    networks:
      - tunnel
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  cloudflared:
    # Für reproduzierbare Deployments eine feste Version eintragen (z. B. cloudflare/cloudflared:2026.9.0).
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Ohne Token beendet sich cloudflared mit Fehlermeldung (docker compose logs cloudflared).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tunnel
      - egress
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  # Nur api <-> cloudflared, ohne Verbindung nach außen.
  tunnel:
    internal: true
  # Ausgehend: cloudflared → Cloudflare, api → sessionserver.mojang.com. Keine veröffentlichten Ports.
  egress: {}

volumes:
  cubiq-data:
